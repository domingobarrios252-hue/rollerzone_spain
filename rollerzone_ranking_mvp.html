let selCat='todas',selGen='todos';

          <span class="cat-count">${rows.length} patinadores</span>

        <div class="table-wrap">
          <div class="t-row header" style="grid-template-columns:32px 36px 1fr 1fr 80px 50px">
            <span>#</span><span></span><span>Patinador/a</span><span>Club</span><span style="text-align:right">Puntos</span><span>País</span>
          </div>`;
      rows.forEach((p,i)=>{
        const rk=i===0?'rk1':i===1?'rk2':i===2?'rk3':'rkn';
        const avClass=p.gen==='f'?'av-f':'av-m';
        html+=`<div class="t-row" style="grid-template-columns:32px 36px 1fr 1fr 80px 50px" onclick="showDetail('${p.id}')">
          <div><div class="rank-num ${rk}">${i+1}</div></div>
          <div><div class="av ${avClass}">${p.ini}</div></div>
          <div><div class="pname">${p.nombre}</div><div class="pclub">${p.ciudad}</div></div>
          <div><div class="pclub">${p.club}</div></div>
          <div class="pts-val">${p.pts}</div>
          <div style="text-align:center;font-size:18px">${p.pais}</div>
        </div>`;
      });
      html+=`</div></div>`;
    });
  });
  if(!html)html=`<div class="empty">No hay patinadores con estos filtros.</div>`;
  wrap.innerHTML=html;
}

function showDetail(id){
  const p=DATA.find(d=>d.id===id);
  if(!p)return;
  document.getElementById('pg-list').classList.remove('on');
  document.getElementById('pg-detail').classList.add('on');
  document.getElementById('bc-name').textContent=p.nombre;
  const cc=catColors[p.cat];
  const gLabel=p.gen==='f'?'Femenino':'Masculino';
  const gBg=p.gen==='f'?'#993556':'#185fa5';
  const avClass=p.gen==='f'?'f':'m';
  document.getElementById('detail-content').innerHTML=`
    <div class="detail-hero"><div class="detail-hero-inner">
      <span class="dtag" style="background:${cc.bg};color:${cc.fg}">${catLabels[p.cat]}</span>
      <span class="dtag" style="background:${gBg};color:#fff;margin-left:6px">${gLabel}</span>
      <h2>${p.nombre}</h2>
      <div class="meta">${p.club} · ${p.ciudad}, España · Temporada 2026</div>
    </div></div>
    <div class="detail-body">
      <div class="profile-card">
        <div class="av-xl ${avClass}">${p.ini}</div>
        <div class="profile-info">
          <h3>${p.nombre}</h3>
          <p>${p.club}</p>
          <p>${p.ciudad}, España · ${p.edad} años</p>
          <div class="ptags">
            <span class="ptag" style="background:${cc.bg};color:${cc.fg}">${catLabels[p.cat]}</span>
            <span class="ptag" style="background:${gBg};color:#fff">${gLabel}</span>
            <span class="ptag ptag-club">${p.club}</span>
          </div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><span class="stat-val">${p.pts}</span><span class="stat-lbl">Puntos MVP 2026</span></div>
        <div class="stat-box"><span class="stat-val">${p.edad}</span><span class="stat-lbl">Edad</span></div>
        <div class="stat-box"><span class="stat-val">${p.titulos}</span><span class="stat-lbl">Títulos nacionales</span></div>
        <div class="stat-box"><span class="stat-val">${p.temporadas}</span><span class="stat-lbl">Temporadas</span></div>
      </div>
      <div class="bio">
        <h4>Biografía</h4>
        <p>${p.bio}</p>
      </div>
      <div class="bio">
        <h4>Palmarés y logros destacados</h4>
        <ul class="logros-list">${p.logros.map(l=>`<li>${l}</li>`).join('')}</ul>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function goList(){
  document.getElementById('pg-detail').classList.remove('on');
  document.getElementById('pg-list').classList.add('on');
  window.scrollTo(0,0);
}

document.getElementById('fg-cat').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  document.querySelectorAll('#fg-cat .fpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  selCat=b.dataset.cat;
  render();
});
document.getElementById('fg-gen').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  document.querySelectorAll('#fg-gen .fpill').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  selGen=b.dataset.gen;
  render();
});

render();
</script>
